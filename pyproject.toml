[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "replit-workspace-cap-matrix"
version = "1.0.0"
description = "Scoped, expiring, revocable capability enforcement for agentic coding workspaces"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
workspace-cap-matrix = "workspace_cap_matrix:cli"

[tool.setuptools]
py-modules = ["workspace_cap_matrix"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
